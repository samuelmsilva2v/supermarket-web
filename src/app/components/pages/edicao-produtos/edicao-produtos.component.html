<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-lg-7">

            <div class="mb-4">
                <h2 class="fonte-titulo mb-1">Edição de produto</h2>
                <p class="text-muted mb-0">Utilize o formulário para modificar os dados do produto.</p>
            </div>

            <div class="card card-etiqueta p-4">

                <div *ngIf="mensagem" class="alert alert-success">
                    <strong>Sucesso!</strong> {{ mensagem }}
                </div>

                <div *ngIf="erroGeral" class="alert alert-danger">
                    <strong>Erro!</strong> {{ erroGeral }}
                </div>

                <form [formGroup]="form" (ngSubmit)="onSubmit()">
                    <div class="mb-3">
                        <div class="form-floating">
                            <input type="text" formControlName="nome" class="form-control" id="nome"
                                placeholder=" " required>
                            <label for="nome">Nome do Produto</label>
                        </div>

                        <app-erro-campo [controle]="form.controls.nome" [mensagens]="mensagensNome"
                            [erroServidor]="erros?.nome"></app-erro-campo>
                    </div>

                    <div class="row">
                        <div class="col-sm-6 mb-3">
                            <div class="form-floating">
                                <input type="number" formControlName="preco" class="form-control numero" id="preco"
                                    placeholder=" " step="0.01" required #precoInput (blur)="formatarPreco(precoInput)">
                                <label for="preco">Preço</label>
                            </div>
                            <div class="form-text">Use vírgula para decimais, ex.: 9,90.</div>

                            <app-erro-campo [controle]="form.controls.preco" [mensagens]="mensagensPreco"
                                [erroServidor]="erros?.preco"></app-erro-campo>
                        </div>

                        <div class="col-sm-6 mb-3">
                            <div class="input-group">
                                <div class="form-floating">
                                    <input type="number" formControlName="quantidade" class="form-control numero" id="quantidade"
                                        placeholder=" " required>
                                    <label for="quantidade">Quantidade</label>
                                </div>

                                <div class="form-floating campo-unidade">
                                    <select class="form-select numero" formControlName="unidadeMedida" id="unidadeMedida"
                                        aria-label="Unidade de medida" required>
                                        <option value="" disabled selected></option>

                                        <option *ngFor="let u of unidadesMedida" value="{{ u.valor }}" title="{{ u.rotulo }}">
                                            {{ u.curto }}
                                        </option>
                                    </select>
                                    <label for="unidadeMedida">Unidade</label>
                                </div>
                            </div>

                            <app-erro-campo [controle]="form.controls.quantidade" [mensagens]="mensagensQuantidade"
                                [erroServidor]="erros?.quantidade"></app-erro-campo>
                            <app-erro-campo [controle]="form.controls.unidadeMedida" [mensagens]="mensagensUnidadeMedida"
                                [erroServidor]="erros?.unidadeMedida"></app-erro-campo>
                        </div>
                    </div>

                    <div class="mb-4">
                        <div class="form-floating">
                            <select class="form-select" formControlName="categoriaId" id="categoria"
                                (change)="onCategoriaChange()" required>
                                <option value="" disabled selected>Selecione a categoria</option>

                                <option *ngFor="let c of categorias" value="{{ c.id }}">
                                    {{ c.nome }}
                                </option>
                            </select>
                            <label for="categoria" class="d-flex align-items-center gap-2">
                                Categoria
                                <span *ngIf="corSelecionada" class="ponto" [style.background-color]="corSelecionada"></span>
                            </label>
                        </div>

                        <app-erro-campo [controle]="form.controls.categoriaId" [mensagens]="mensagensCategoria"
                            [erroServidor]="erros?.categoriaId"></app-erro-campo>
                    </div>

                    <div class="row">
                        <div class="col-sm-6">
                            <button type="button" class="btn btn-outline-secondary w-100" (click)="voltar()">Voltar</button>
                        </div>

                        <div class="col-sm-6">
                            <button type="submit" class="btn btn-warning w-100" [disabled]="form.invalid">Atualizar Produto</button>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
