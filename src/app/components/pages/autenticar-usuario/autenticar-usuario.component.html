<div class="d-flex flex-column align-items-center justify-content-center mt-5 px-3">

    <div class="d-flex align-items-center gap-2 mb-4 text-primary">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M12 21c-4.97 0-9-4.03-9-9 0-6 6-10 15-10 0 9-4 10-10 10-2 0-3.5-.5-5-2"
                stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
        <span class="fonte-titulo fs-3">Supermercado</span>
    </div>

    <div class="card card-etiqueta p-4" style="width: 100%; max-width: 400px;">

        <h3 class="fonte-titulo text-center mb-1">Entrar na sua conta</h3>
        <p class="text-center text-muted">Entre com as suas credenciais</p>

        <div *ngIf="mensagem" class="text-danger">
            <strong>{{ mensagem }}</strong>
        </div>

        <form [formGroup]="form" (ngSubmit)="onSubmit()">

            <div class="mb-3">
                <div class="form-floating">
                    <input type="text" formControlName="username" class="form-control" id="username" placeholder=" " required>
                    <label for="username">Username</label>
                </div>

                <app-erro-campo [controle]="form.controls.username" [mensagens]="mensagensUsername"
                    [erroServidor]="erros?.username"></app-erro-campo>
            </div>

            <div class="mb-3">
                <div class="form-floating">
                    <input type="password" formControlName="senha" class="form-control" id="password" placeholder=" " required>
                    <label for="password">Senha</label>
                </div>

                <app-erro-campo [controle]="form.controls.senha" [mensagens]="mensagensSenha"
                    [erroServidor]="erros?.senha"></app-erro-campo>
            </div>

            <button type="submit" class="btn btn-primary w-100" [disabled]="form.invalid">Entrar</button>

        </form>

        <p class="text-center mt-3 mb-0">
            <a routerLink="/pages/esqueci-senha">Esqueci minha senha</a>
        </p>

    </div>

</div>
