<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-lg-9">

            <div class="mb-4">
                <h2 class="fonte-titulo mb-1">Consulta de usuários</h2>
                <p class="text-muted mb-0">Filtre por nome, username, status ou perfil.</p>
            </div>

            <div class="card card-etiqueta p-4 mb-4">
                <form [formGroup]="form" (ngSubmit)="onSubmit()">

                    <div class="d-flex gap-2 align-items-center flex-wrap">
                        <div class="form-floating flex-grow-1">
                            <input type="text" formControlName="nome" class="form-control" id="nomeUsuario"
                                placeholder=" ">
                            <label for="nomeUsuario">Filtrar por nome</label>
                        </div>

                        <button type="button" class="btn btn-outline-secondary d-flex align-items-center gap-2"
                            (click)="toggleMaisFiltros()" [attr.aria-expanded]="mostrarMaisFiltros"
                            aria-controls="maisFiltrosUsuarios">
                            Mais filtros
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" aria-hidden="true"
                                class="seta-filtro" [class.aberto]="mostrarMaisFiltros">
                                <path d="M6 9l6 6 6-6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"
                                    stroke-linejoin="round" />
                            </svg>
                        </button>

                        <button type="submit" class="btn btn-primary">Pesquisar</button>
                    </div>

                    <div class="filtros-avancados" [class.aberto]="mostrarMaisFiltros" id="maisFiltrosUsuarios">
                        <div>
                            <div class="row g-2 mt-1">
                                <div class="col-md-4">
                                    <div class="form-floating">
                                        <input type="text" formControlName="username" class="form-control"
                                            id="usernameFiltro" placeholder=" ">
                                        <label for="usernameFiltro">Username</label>
                                    </div>
                                </div>

                                <div class="col-6 col-md-4">
                                    <div class="form-floating">
                                        <select class="form-select" formControlName="ativo" id="statusFiltro">
                                            <option value="">Todos</option>
                                            <option value="true">Ativos</option>
                                            <option value="false">Inativos</option>
                                        </select>
                                        <label for="statusFiltro">Status</label>
                                    </div>
                                </div>

                                <div class="col-6 col-md-4">
                                    <div class="form-floating">
                                        <select class="form-select" formControlName="perfil" id="perfilFiltro">
                                            <option value="">Todos</option>
                                            <option value="Operador">Operador</option>
                                            <option value="Administrador">Administrador</option>
                                        </select>
                                        <label for="perfilFiltro">Perfil</label>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </form>

                <app-filtro-chips [chips]="filtrosAtivos" (remover)="removerFiltro($event)"
                    (limparTudo)="limparFiltros()"></app-filtro-chips>
            </div>

            <div *ngIf="mensagem" class="alert alert-success">
                <strong>Sucesso!</strong> {{ mensagem }}
            </div>

            <div *ngIf="erroStatus" class="alert alert-danger">
                <strong>Erro!</strong> {{ erroStatus }}
            </div>

            <div class="row g-3" *ngIf="usuarios.length > 0">
                <div class="col-md-6 col-lg-4" *ngFor="let u of usuarios">
                    <div class="card card-etiqueta p-3 h-100 d-flex flex-column">
                        <span class="badge mb-2" [ngClass]="u.perfil === 'Administrador' ? 'bg-primary' : 'bg-secondary'"
                            style="width: fit-content;">
                            {{ u.perfil }}
                        </span>

                        <h5 class="mb-1">{{ u.nome }} {{ u.sobrenome }}</h5>

                        <p class="text-muted mb-3">
                            &#64;{{ u.username }}
                            <br>
                            {{ u.email }}
                        </p>

                        <div class="mt-auto d-flex gap-2">
                            <button [routerLink]="['/pages/edicao-usuarios', u.id]" class="btn btn-warning btn-sm flex-grow-1">Atualizar</button>
                            <button (click)="onAlterarStatus(u)" class="btn btn-sm flex-grow-1"
                                [ngClass]="u.ativo ? 'btn-danger' : 'btn-success'">
                                {{ u.ativo ? 'Inativar' : 'Ativar' }}
                            </button>
                        </div>
                    </div>
                </div>
            </div>

            <p *ngIf="usuarios.length === 0" class="text-muted text-center mt-4">
                Nenhum usuário encontrado.
            </p>

            <app-paginacao [paginaAtual]="pagina" [totalPaginas]="totalPaginas" [totalElementos]="totalElementos"
                [tamanhoPagina]="tamanho" [tamanhosDisponiveis]="[12, 24, 48]" (paginaMudou)="onPaginaMudou($event)"
                (tamanhoMudou)="onTamanhoMudou($event)">
            </app-paginacao>

        </div>
    </div>
</div>

<app-confirm-modal [open]="exibirConfirmacaoStatus" [title]="tituloConfirmacaoStatus"
    [message]="mensagemConfirmacaoStatus" [confirmText]="usuarioParaAlterarStatus?.ativo ? 'Inativar' : 'Ativar'"
    cancelText="Cancelar" [variant]="usuarioParaAlterarStatus?.ativo ? 'danger' : 'primary'"
    (confirmed)="confirmarAlteracaoStatus()" (cancelled)="cancelarAlteracaoStatus()">
</app-confirm-modal>
